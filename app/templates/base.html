{% load i18n static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Web Kyrgyzstan{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{% translate 'An interactive educational website about Kyrgyzstan for children and teenagers.' %}{% endblock %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {# Временный каркас этапа 0; полноценная шапка, подвал и дизайн-система — на этапе 2 #}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
