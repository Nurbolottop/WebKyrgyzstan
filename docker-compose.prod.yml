# Production: docker compose -f docker-compose.prod.yml up -d --build
#
# Nginx работает на хосте: проксирует запросы на 127.0.0.1:${WEB_PORT}
# и сам отдаёт ./volumes/static и ./volumes/media.
# Каталоги ./volumes/* должны принадлежать UID 1000 (пользователь app в контейнере).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - DJANGO_COLLECTSTATIC=1
      - DJANGO_COMPILEMESSAGES=1
      - CACHE_DIR=/tmp/webkg-cache
    volumes:
      - ./volumes/static:/app/staticfiles
      - ./volumes/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8098}:8000"

volumes:
  postgres_data:
