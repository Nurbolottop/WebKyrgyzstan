# /etc/nginx/sites-available/webkg.zeastudio.su
# HTTPS-блоки добавляет certbot (certbot --nginx -d webkg.zeastudio.su).
# Общие лимиты запросов сервера — в /etc/nginx/conf.d/ratelimit.conf.

server {
    listen 80;
    server_name webkg.zeastudio.su;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml application/xml;

    # Имена статики содержат хеш — кешируем «навсегда»
    location /static/ {
        alias /root/WebKyrgyzstan/volumes/static/;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /root/WebKyrgyzstan/volumes/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
